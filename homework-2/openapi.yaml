openapi: 3.0.3
info:
  title: Mini Kanban Board API
  description: Contrato formal REST para la gestión de tarjetas y columnas del tablero Kanban.
  version: 1.0.0
servers:
  - url: http://localhost:8000/api
    description: Servidor local de desarrollo
paths:
  /health:
    get:
      summary: Health check
      description: Verifica el estado del backend FastAPI
      responses:
        '200':
          description: Servidor en funcionamiento
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /tasks:
    get:
      summary: Listar todas las tareas
      description: Obtiene la lista completa de tareas del tablero agrupables por columna
      responses:
        '200':
          description: Lista de tareas recuperada exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'

    post:
      summary: Crear una nueva tarea
      description: Agrega una nueva tarjeta en una de las columnas (por defecto 'todo')
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Tarea creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

  /tasks/{taskId}:
    patch:
      summary: Actualizar una tarea
      description: Modifica el título, descripción o mueve la tarjeta de columna
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
          description: ID único de la tarea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Tarea actualizada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Tarea no encontrada

    delete:
      summary: Eliminar una tarea
      description: Remueve permanentemente una tarjeta del tablero
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
          description: ID de la tarea a eliminar
      responses:
        '200':
          description: Tarea eliminada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Task deleted successfully
        '404':
          description: Tarea no encontrada

components:
  schemas:
    Task:
      type: object
      required:
        - id
        - title
        - column
        - created_at
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "Diseñar wireframe del tablero"
        description:
          type: string
          example: "Crear esquema en lápiz y papel o Figma"
        column:
          type: string
          enum: [todo, in_progress, done]
          example: "todo"
        created_at:
          type: string
          format: date-time
          example: "2026-09-14T16:00:00Z"

    TaskCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          example: "Implementar backend FastAPI"
        description:
          type: string
          default: ""
          example: "Crear modelos SQLite y endpoints REST"
        column:
          type: string
          enum: [todo, in_progress, done]
          default: "todo"
          example: "todo"

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          example: "Título modificado"
        description:
          type: string
          example: "Descripción actualizada"
        column:
          type: string
          enum: [todo, in_progress, done]
          example: "in_progress"
