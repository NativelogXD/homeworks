name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay_password
          POSTGRES_DB: agent_relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Run Test Suite
        env:
          RELAY_DATABASE_URL: postgresql+psycopg://relay:relay_password@localhost:5432/agent_relay
        run: uv run pytest -v

  deploy:
    name: Build & Deploy to Kubernetes
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: agent-relay-cluster

      - name: Set Image Tag
        run: echo "IMAGE_TAG=agent-relay:${GITHUB_SHA:-v2}" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build -t ${IMAGE_TAG} .
          docker tag ${IMAGE_TAG} agent-relay:local

      - name: Load Image into kind
        run: |
          kind load docker-image ${IMAGE_TAG} --name agent-relay-cluster
          kind load docker-image agent-relay:local --name agent-relay-cluster

      - name: Apply Manifests and Rollout
        run: |
          kubectl apply -f k8s/
          kubectl wait --for=condition=ready pod -l app=postgres --timeout=120s
          kubectl wait --for=condition=ready pod -l app=agent-relay --timeout=120s
          kubectl rollout status deployment/agent-relay --timeout=90s

